<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Апонасенко Михаил Андреевич, группа В">
    <meta name="description" content="VSCustom - ваш помощник в кастомизации редатора кода VS Code">
    <title>VS Custom - отзывы</title>
        <link rel="icon" href="images/fav.png" sizes="16x16" type="image/png">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/feedback.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script defer src="js/main.js"></script>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <div class="container header_container">
                <button class="header-burger-btn" id="burger">
                    <span></span><span></span><span></span>
                </button>
                <a href="index.html" class="logo">
                    <img class="logo_img" src="images/logo.png" alt="логотип">
                    <img class="logo_img_mobile" src="images/fav.png" alt="логотип мобильный">
                </a>
                <nav class="menu">
                    <ul class="menu_list">
                        <li class="menu_item">
                            <a class="menu_link" href="index.html">Главная</a>
                        </li>
                        <li class="menu_item">
                            <a class="menu_link" href="custom.html">Кастомизация</a>
                        </li>
                        <li class="menu_item">
                            <a class="menu_link" href="feedback.html">Отзывы</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        <main class="main">
            <div class="container">
                <h1>Форма для отзывов</h1>
                <form action="feedback.php" method="post" enctype="multipart/form-data" autocomplete="on">
                    <fieldset class="fieldset">
                        <legend class="legend">Ваше мнение очень важно для нас, оставьте свой отзыв:</legend>
                        <div class="feedback_">
                            <label for="name">Имя:</label><br>
                            <input type="text" name="name" id="name" required placeholder="Введите полное имя"><br>
                            <label for="surname">Фамилия:</label><br>
                            <input type="text" name="surname" id="surname" required placeholder="Введите полную фамилию"><br>
                            <label for="mail">Ваша почта:</label><br>
                            <input type="email" name="mail" id="mail" required placeholder="Введите адрес вашей почты"><br>
                            <label for="feedback_message">Ваш отзыв:</label><br>
                            <textarea name="feedback_message" id="feedback_message" required placeholder="Введите текст"></textarea><br>
                            <div class="sub_res_btn">
                                <button class="submit_reset" type="submit">Отправить</button>
                                <button class="submit_reset" type="reset">Очистить</button>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
            <button class="topBtn">
                ↑
            </button>
        </main>
        <footer class="footer">
            <div class="container footer_container">
                <p class="footer_p">&copy; 2025 - сайт создан вне целей коммерческого использования</p>
            </div>
        </footer>
    </div>
</body>
</html>
